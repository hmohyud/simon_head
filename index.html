<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simon</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="backdrop"></div>
    <canvas id="stage"></canvas>
    <div id="grain"></div>
    <div id="loading">
      <span id="load-label">quarrying the marble&hellip;</span>
      <div id="load-bar"><i></i></div>
    </div>
    <div id="marbles">
      <button class="swatch active" data-variant="carrara" title="Carrara"></button>
      <button class="swatch tex" data-variant="tiles" title="Marble Tiles" style="background-image: url(textures/tiles/albedo.jpg)"></button>
      <button class="swatch tex" data-variant="metal" title="Patchy Metal" style="background-image: url(textures/metal/albedo.jpg)"></button>
      <button class="swatch tex" data-variant="stucco" title="Stucco" style="background-image: url(textures/stucco/albedo.jpg)"></button>
      <button class="swatch tex" data-variant="wicker" title="Wicker" style="background-image: url(textures/wicker/albedo.jpg)"></button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
