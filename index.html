<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- resizes-content keeps the fixed chat bar above the phone keyboard;
         viewport-fit lets the safe-area insets below do their job -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Simon</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="backdrop"></div>
    <canvas id="stage"></canvas>
    <div id="grain"></div>
    <div id="loading">
      <span id="load-label">quarrying the marble&hellip;</span>
      <div id="load-bar"><i></i></div>
    </div>
    <div id="marbles">
      <button class="swatch active" data-variant="carrara" title="Carrara"></button>
      <button class="swatch tex" data-variant="tiles" title="Marble Tiles" style="background-image: url(textures/tiles/albedo.jpg)"></button>
      <button class="swatch tex" data-variant="metal" title="Patchy Metal" style="background-image: url(textures/metal/albedo.jpg)"></button>
      <button class="swatch tex" data-variant="stucco" title="Stucco" style="background-image: url(textures/stucco/albedo.jpg)"></button>
    </div>
    <div id="chat">
      <div id="chat-history">
        <div id="chat-history-bar">
          <span>this stays in your browser</span>
          <button id="chat-clear" type="button">clear</button>
        </div>
        <div id="chat-log"></div>
      </div>
      <div id="chat-reply" aria-live="polite"></div>
      <form id="chat-form" autocomplete="off">
        <input
          id="chat-input"
          name="message"
          placeholder="say something to Simon&hellip;"
          maxlength="240"
          autocomplete="off"
        />
        <button id="chat-send" type="submit" title="send" aria-label="send"></button>
        <button id="chat-history-btn" type="button" title="chat history"></button>
      </form>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
